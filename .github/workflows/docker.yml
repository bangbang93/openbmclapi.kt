name: Docker Image CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.meta.outputs.base }}
    steps:
      - name: 计算镜像基础标签
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "base=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: bangbang93/openbmclapi.kt:${{ needs.prepare.outputs.base }}-amd64
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: bangbang93/openbmclapi.kt:${{ needs.prepare.outputs.base }}-arm64
          platforms: linux/arm64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  merge:
    needs: [ prepare, build-amd64, build-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: 合并多架构 manifest
        run: |
          BASE="bangbang93/openbmclapi.kt:${{ needs.prepare.outputs.base }}"
          docker manifest create "$BASE" \
            "${BASE}-amd64" \
            "${BASE}-arm64"
          docker manifest push "$BASE"
